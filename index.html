<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe | VOSC Activity-1</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>Tic-Tac-Toe</h1>

    <div class="scoreboard">
      <div class="score" id="score-x"><span>Player X</span><strong id="x-wins">0</strong></div>
      <div class="score" id="score-draw"><span>Draws</span><strong id="draws">0</strong></div>
      <div class="score" id="score-o"><span>Player O</span><strong id="o-wins">0</strong></div>
    </div>

    <p id="status" role="status" aria-live="polite">X's turn</p>

    <div class="board" id="board" aria-label="Game board">
      <button class="cell" data-index="0" aria-label="Row 1, column 1"></button>
      <button class="cell" data-index="1" aria-label="Row 1, column 2"></button>
      <button class="cell" data-index="2" aria-label="Row 1, column 3"></button>
      <button class="cell" data-index="3" aria-label="Row 2, column 1"></button>
      <button class="cell" data-index="4" aria-label="Row 2, column 2"></button>
      <button class="cell" data-index="5" aria-label="Row 2, column 3"></button>
      <button class="cell" data-index="6" aria-label="Row 3, column 1"></button>
      <button class="cell" data-index="7" aria-label="Row 3, column 2"></button>
      <button class="cell" data-index="8" aria-label="Row 3, column 3"></button>
    </div>

    <div class="actions">
      <button id="restart" class="btn">New round</button>
      <button id="reset" class="btn btn-ghost">Reset scores</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
